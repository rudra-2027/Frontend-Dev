<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Tooltip Demonstration Page</h1>
    <section class="tooltip-container">
      <div class="tooltip">
        &UpArrow;
        <div><span class="tooltip-text">This Tag For Up Arrow</span></div>
      </div>
      <div class="tooltip">
        &RightArrow;
        <div><span class="tooltip-text">This Tag For Right Arrow</span></div>
      </div>
      <div class="tooltip">
        &LeftArrow;
        <div><span class="tooltip-text">This Tag For Left Arrow</span></div>
      </div>

    </section>
  </main>

</body>

</html>
