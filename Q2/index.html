<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <iframe title="Map showing Kolkata, India" width="100%" height="450"
    src="https://maps.google.com/maps?q=Kolkata,India&z=13&output=embed" loading="lazy" style="border:0;"
    allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="note">
    Note : loading="lazy" tells the browser to defer loading the iframe's content
    until the iframe is near the viewport
  </div>
</body>

</html>
