<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="Q3.css">
</head>

<body>
    <h1>Responsive Image Showcase</h1>
    <p class="subtitle">Hover over each image to see the effect.</p>

    <div class="gallery">
        <figure class="image-card">
            <img src="https://images.pexels.com/photos/371589/pexels-photo-371589.jpeg?cs=srgb&dl=clouds-conifer-daylight-371589.jpg&fm=jpg"
                alt="Nature Image 1">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://tse3.mm.bing.net/th/id/OIP.vGhP-KILNpz_7idtVKmAJwHaEw?rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Nature Image 2">
            <figcaption>Serene Lake</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://wallup.net/wp-content/uploads/2019/09/929216-beautiful-nature-grass-sunset-field-sky.jpg"
                alt="Nature Image 3">
            <figcaption>Sunset Over Fields</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://th.bing.com/th/id/OIP.c1XsWKEFfcPFZidEsSVvOAHaEn?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Nature Image 4">
            <figcaption>City Skyline</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://th.bing.com/th/id/OIP.XbJyRg1asUlGL_sD4WMzigHaE8?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Nature Image 5">
            <figcaption>Calm Beach</figcaption>
        </figure>

        <figure class="image-card">
            <img src="https://png.pngtree.com/thumb_back/fw800/background/20240514/pngtree-beautiful-photo-photograph-of-a-pathway-in-forest-image_15778533.jpg"
                alt="Nature Image 6">
            <figcaption>Forest Pathway</figcaption>
        </figure>
    </div>
</body>

</html>
