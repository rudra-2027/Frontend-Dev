<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <div style="grid-area: display;" class="display">0</div>
    <button style="grid-area: ac; background-color: #ADD8E6; color: #050A2B;">AC</button>
    <button style="grid-area: plusminus; background-color: #ADD8E6; color:#050A2B">+-</button>
    <button style="grid-area: modules; background-color: #ADD8E6 ; color: #050A2B;">%</button>
    <button style="grid-area: divison; background-color: #FFD700">÷</button>
    <button style="grid-area: seven; background-color:#050A2B">7</button>
    <button style="grid-area: eight;background-color:#050A2B">8</button>
    <button style="grid-area: nine; background-color:#050A2B">9</button>
    <button style="grid-area: mul; background-color: #FFD700">×</button>
    <button style="grid-area: four; background-color:#050A2B">4</button>
    <button style="grid-area: five; background-color:#050A2B">5</button>
    <button style="grid-area: six;background-color:#050A2B">6</button>
    <button style="grid-area: minus; background-color: #FFD700">−</button>
    <button style="grid-area: one; background-color:#050A2B">1</button>
    <button style="grid-area: two; background-color:#050A2B">2</button>
    <button style="grid-area: three; background-color:#050A2B">3</button>
    <button style="grid-area: plus; background-color: #FFD700">+</button>
    <button style="grid-area: zero; background-color:#050A2B">0</button>
    <button style="grid-area: fullstop; background-color:#050A2B">.</button>
    <button style="grid-area: equals; background-color:#FFD700">=</button>
  </main>

</body>

</html>
