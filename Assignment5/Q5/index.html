<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing table</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="pricing-section">
    <h1>Pricing Plans</h1>
    <div class="data">
      <div class="card basic">
        <h2>Basics</h2>
        <ul>
          <li>
            Only For One User
          </li>


          <li>

            One Device Access
          </li>
        </ul>
        <h4 class="price">Price=250/month</h4>
        <button type="button"><a href="#">Buy Plan</a></button>

      </div>
      <div class="card Standard">
        <h2>Standard</h2>
        <ul>
          <li>
            Only For Two/Three User
          </li>

          <li>

            Two Device Access at a time
          </li>
        </ul>
        <h4 class="price">Price=400/month</h4>
        <button type="button"><a href="#">Buy Plan</a></button>

      </div>

      <div class="card Premium">
        <h2>Premium</h2>
        <ul>
          <li>
            Only For Five User
          </li>

          <li>

            Five Device Access at a time
          </li>
        </ul>
        <h4 class="price">Price=1000/month</h4>
        <button type="button"><a href="#">Buy Plan</a></button>

      </div>
    </div>

  </section>

</body>

</html>
