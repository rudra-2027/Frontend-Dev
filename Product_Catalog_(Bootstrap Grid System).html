<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product:hover {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transform: scale(1.03);
      transition: 0.3s;
    }
  </style>
</head>

<body class="bg-light">
  <div class="container text-center py-5">
    <h2 class="mb-4 fw-bold">Product Catalog</h2>
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3">
        <div class="p-3 bg-white product rounded">
          <img
            src="https://media.istockphoto.com/id/1414801672/photo/cardboard-box-with-cosmetics-product-in-front-od-open-door-buying-online-and-delivery.jpg?s=612x612&w=0&k=20&c=SA9VCzp-QtpzlliX8dM_uoH8K20U1gHqYfsWP08aLl0="
            class="img-fluid mb-3" alt="">
          <h5>Product 1</h5>
          <p>$25</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="p-3 bg-white product rounded">
          <img
            src="https://media.istockphoto.com/id/1414801672/photo/cardboard-box-with-cosmetics-product-in-front-od-open-door-buying-online-and-delivery.jpg?s=612x612&w=0&k=20&c=SA9VCzp-QtpzlliX8dM_uoH8K20U1gHqYfsWP08aLl0="
            class="img-fluid mb-3" alt="">
          <h5>Product 2</h5>
          <p>$30</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="p-3 bg-white product rounded">
          <img
            src="https://media.istockphoto.com/id/1414801672/photo/cardboard-box-with-cosmetics-product-in-front-od-open-door-buying-online-and-delivery.jpg?s=612x612&w=0&k=20&c=SA9VCzp-QtpzlliX8dM_uoH8K20U1gHqYfsWP08aLl0="
            class="img-fluid mb-3" alt="">
          <h5>Product 3</h5>
          <p>$40</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="p-3 bg-white product rounded">
          <img
            src="https://media.istockphoto.com/id/1414801672/photo/cardboard-box-with-cosmetics-product-in-front-od-open-door-buying-online-and-delivery.jpg?s=612x612&w=0&k=20&c=SA9VCzp-QtpzlliX8dM_uoH8K20U1gHqYfsWP08aLl0="
            class="img-fluid mb-3" alt="">
          <h5>Product 4</h5>
          <p>$50</p>
          <button class="btn btn-primary">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
