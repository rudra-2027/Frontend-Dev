<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4 fw-bold">User Notifications</h2>

    <div class="card p-4 shadow-sm">
      <div class="alert alert-success" role="alert">
        New message received from Admin.
      </div>
      <div class="alert alert-info" role="alert">
        Tip: Update your profile to get better recommendations.
      </div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        Warning: Your subscription will expire soon!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>

      <div class="bg-light border rounded p-3 mt-4">
        <h5 class="fw-bold">Summary</h5>
        <p class="mb-0">You have 3 new notifications. Please check your messages and renew your plan to continue
          enjoying premium features.</p>
      </div>
    </div>
  </div>


</body>

</html>
