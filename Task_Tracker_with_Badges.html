<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
  <div class="container py-5">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Task Tracker <span class="badge bg-primary">3 Pending</span></h2>
      <p class="text-muted">Track and manage your daily tasks efficiently</p>
    </div>

    <ul class="list-group mb-4">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish Bootstrap Project
        <span class="badge bg-danger">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Read Documentation
        <span class="badge bg-warning text-dark">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Clean Inbox
        <span class="badge bg-success">Low</span>
      </li>
    </ul>

    <div class="text-center">
      <button class="btn btn-success">
        Completed <span class="badge bg-light text-success">2</span>
      </button>
    </div>
  </div>
</body>

</html>
