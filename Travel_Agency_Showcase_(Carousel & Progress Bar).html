<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">

  <div class="container py-5 text-center">
    <h2 class="fw-bold mb-4">Explore the World with Us</h2>

    <div id="travelCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
      <div class="carousel-inner rounded shadow">
        <div class="carousel-item active" data-bs-interval="2000">
          <img src="https://wallpaperaccess.com/full/185289.jpg" class="d-block w-100" alt="Paris">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
            <h5>Paris, France</h5>
            <p>The city of lights and love awaits you.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://wallpaperaccess.com/full/185289.jpg" class="d-block w-100" alt="Maldives">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
            <h5>Maldives</h5>
            <p>Relax by the turquoise beaches and luxury villas.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="2500">
          <img src="https://wallpaperaccess.com/full/185289.jpg" class="d-block w-100" alt="Tokyo">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-2">
            <h5>Tokyo, Japan</h5>
            <p>Experience tradition and technology in perfect harmony.</p>
          </div>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <h5 class="fw-bold mb-3">Booking Progress</h5>
    <div class="progress mb-5" style="height: 25px;">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%;">70% Complete
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-1">Travels</p>
    <p class="mb-0">Contact: info@com</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
