<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card {
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body class="bg-light text-dark">
  <div class="container py-5 text-center">
    <h2 class="fw-bold mb-4">Choose Your Plan</h2>
    <div class="row g-4">
      <div class="col-12 col-md-4">
        <div class="card p-4 shadow-sm">
          <h4 class="fw-bold mb-3">Basic</h4>
          <h2 class="fw-bold mb-3">$9<span class="fs-6 text-muted">/month</span></h2>
          <ul class="list-unstyled mb-4">
            <li>5 Projects</li>
            <li>Email Support</li>
            <li>Custom Reports</li>
          </ul>
          <button class="btn btn-outline-primary w-100">Select</button>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card p-4 bg-primary text-white shadow-sm">
          <h4 class="fw-bold mb-3">Pro</h4>
          <h2 class="fw-bold mb-3">$19<span class="fs-6 text-light">/month</span></h2>
          <ul class="list-unstyled mb-4">
            <li>Unlimited Projects</li>
            <li>Priority Support</li>
            <li>Custom Reports</li>
          </ul>
          <button class="btn btn-light w-100">Select</button>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card p-4 shadow-sm">
          <h4 class="fw-bold mb-3">Enterprise</h4>
          <h2 class="fw-bold mb-3">$49<span class="fs-6 text-muted">/month</span></h2>
          <ul class="list-unstyled mb-4">
            <li>Team Access</li>
            <li>Dedicated Manager</li>
            <li>Advanced Analytics</li>
          </ul>
          <button class="btn btn-outline-primary w-100">Select</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
