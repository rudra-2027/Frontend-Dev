<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-only Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="gallery">
    <figure class="items">
      <img
        src="https://images.pexels.com/photos/371633/pexels-photo-371633.jpeg?cs=srgb&dl=clouds-country-daylight-371633.jpg&fm=jpg"
        alt="River">
      <figcaption>River</figcaption>
    </figure>

    <figure class="items">
      <img src="https://tse4.mm.bing.net/th/id/OIP.A0fcYW78VYuS0M8dZcYAkAHaEY?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Hills">
      <figcaption>Hills</figcaption>
    </figure>

    <figure class="items">
      <img src="https://img.freepik.com/premium-photo/landscape-panorama-with-mountains_926199-3379.jpg"
        alt="Mountains">
      <figcaption>Mountains</figcaption>
    </figure>

    <figure class="items">
      <img
        src="https://th.bing.com/th/id/R.8cbd5eda7993c1bd6c2109b35e14afc5?rik=8SmOLEwmadxSIg&riu=http%3a%2f%2fgetwallpapers.com%2fwallpaper%2ffull%2f8%2fd%2fc%2f934929-free-dog-desktop-wallpaper-1920x1080.jpg&ehk=%2btmw7jqmtf%2bstlU6eIOl5H3eYYKpk8cbQnWlgQFm7H8%3d&risl=&pid=ImgRaw&r=0"
        alt="Dog">
      <figcaption>Dog</figcaption>
    </figure>

    <figure class="items">
      <img
        src="https://th.bing.com/th/id/R.c7323985c0cfcfbd888b2d41bd681ebb?rik=VD6nxM2TPFGhfQ&riu=http%3a%2f%2fwallpapercave.com%2fwp%2ft8Yifov.jpg&ehk=BibyDGrdfIvq55JVXkuXywApCE0IF8qGmgDksbmq3yw%3d&risl=&pid=ImgRaw&r=0"
        alt="Forest">
      <figcaption>Forest</figcaption>
    </figure>

    <figure class="items">
      <img src="https://tse3.mm.bing.net/th/id/OIP.jtBTi976pesB-o0SclioGwHaEo?rs=1&pid=ImgDetMain&o=7&rm=3"
        alt="Desert">

    </figure>

</body>

</html>
