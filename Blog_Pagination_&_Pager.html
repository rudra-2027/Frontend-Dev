<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Pagination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-dark">
  <div class="container py-5 text-center">
    <h2 class="fw-bold mb-4">Blog Posts</h2>
    <p class="text-muted mb-5">Explore more articles using the pagination below</p>

    <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item">
          <a class="page-link" href="#">Previous</a>
        </li>
        <li class="page-item active">
          <a class="page-link" href="#">1</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">2</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">Next</a>
        </li>
      </ul>
    </nav>

    <div class="d-flex justify-content-between mt-4">
      <button class="btn btn-outline-secondary">&laquo; Older Posts</button>
      <button class="btn btn-outline-secondary">Newer Posts &raquo;</button>
    </div>
  </div>
</body>

</html>
