<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown-based Selection Page</title>
</head>

<body>
  <h1>Travel Selection Page</h1>
  <label for="country">Select Country</label>
  <select>
    <option selected>India</option>
    <option>USA</option>
    <option>Japan</option>
    <option>France</option>
  </select>

  <br><br>
  <label for="state">Select State:</label>
  <select>
    <option selected>Maharashtra</option>
    <option>Gujarat</option>
    <option>Tamil Nadu</option>
    <option>Karnataka</option>
  </select>

  <br><br>

  <label for="city">Select City:</label>
  <select>
    <option selected>Mumbai</option>
    <option>Pune</option>
    <option>Chennai</option>
    <option>Bangalore</option>
  </select>
  <br><br>

  <label for="place">Favorite Tourist Place:</label>
  <select>
    <option selected>Gateway of India</option>
    <option>Taj Mahal</option>
    <option>Charminar</option>
    <option>Red Fort</option>
  </select>
  <br><br>

  <p>
    You have selected <strong>India</strong> as your country,
    <strong>Maharashtra</strong> as your state,
    <strong>Mumbai</strong> as your city, and
    your favorite tourist place is <strong>Gateway of India</strong>.
  </p>
</body>

</html>
