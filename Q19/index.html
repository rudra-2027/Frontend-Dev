<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>Secure Login Form</h2>
  <form action="#" method="post" autocomplete="off">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <input type="submit" value="Login">
  </form>

  <hr>
  <p><strong>Note:</strong> Turning off <code>autocomplete</code> can improve security because it prevents browsers from
    saving and auto-filling sensitive data such as usernames and passwords. This helps protect users on shared or public
    computers.</p>


</body>

</html>
